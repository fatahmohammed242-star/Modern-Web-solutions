<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modern Groups | Modern Man, Fashion Fuel, Mina Rice Merchants</title>
<meta name="description" content="Modern Groups: branded fashion at Modern Man, budget clothing at Fashion Fuel, and quality rice at Mina Rice Merchants. Order on WhatsApp.">
<meta property="og:title" content="Modern Groups">
<meta property="og:description" content="Branded fashion, budget clothing, and quality rice. Order on WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EEF0F2;--ink:#12161C;--muted:#4B5563;--line:#CBD0D6;--card:#FFFFFF;
--display:"Syne","Arial Black",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1114;--ink:#EEF0F2;--muted:#A3ABB5;--line:#2A3038;--card:#181D23}}
:root[data-theme="dark"]{--bg:#0E1114;--ink:#EEF0F2;--muted:#A3ABB5;--line:#2A3038;--card:#181D23}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;font-size:17px}
a{color:inherit}
:focus-visible{outline:3px solid #2347F5;outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:20px}
.brand svg{width:34px;height:34px}
nav{display:flex;flex-wrap:wrap;gap:4px 16px}
nav a{text-decoration:none;font-weight:500;font-size:15px;padding:4px 0;border-bottom:2px solid transparent}
nav a.on{border-color:var(--ink);font-weight:700}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0 0 14px}
h1{font-size:clamp(36px,8vw,76px)}h2{font-size:clamp(24px,4vw,36px)}
.pg{padding:28px 0 56px}.mut{color:var(--muted);max-width:36em}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin:18px 0 36px}
.card{background:var(--card);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px}
.card img{width:100%;border-radius:10px;display:block}
.card h3{margin:0;font-size:20px}.card p{margin:0}.card small{opacity:.75}
.x{background:var(--c);color:var(--t)}
.mm{--c:#111;--t:#F1E7CF;--a:#C9A24B}.ff{--c:#111;--t:#fff;--a:#FBBF24}.rc{--c:#2A1B0A;--t:#F6E3A6;--a:#D9A62E}
.mark{width:38px;height:38px;border-radius:50%;object-fit:cover}.hero-logo{width:100%;max-width:560px;border-radius:16px;display:block;margin-bottom:20px}.blogo{width:120px;height:120px;border-radius:16px;object-fit:cover;display:block}.card .blogo{width:88px;height:88px}
.btn,.wbtn{display:inline-block;padding:11px 20px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;font:inherit;font-weight:700;background:var(--ink);color:var(--bg)}
.x .wbtn{background:var(--a);color:var(--c)}
.card .wbtn{align-self:flex-start;margin-top:auto}
.ban{padding:36px 0}.ban .wrap{display:grid;gap:12px}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tiles a{text-decoration:none;padding:22px;border-radius:16px;font-family:var(--display);font-weight:800;font-size:22px}
ul.sells{padding-left:20px;margin:0}
.f{display:grid;gap:10px;max-width:520px;margin:12px 0 28px}
label{display:grid;gap:4px;font-weight:700;font-size:14px}
input,select,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.stat{display:flex;gap:24px;margin:8px 0 24px;font-weight:700}
footer{padding:24px 0 40px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:90%;opacity:0;pointer-events:none;transition:.2s;z-index:50;font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0)}
.lcard{display:flex;gap:18px;align-items:center;border-radius:20px;padding:20px;margin:22px 0 32px;flex-wrap:wrap}
.lcb{flex:1;min-width:240px;display:grid;gap:10px}
.line{position:relative;height:14px;border-radius:99px;background:rgba(255,255,255,.2)}
.line i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--a,#C9A24B)}
.line.sm{background:var(--line);height:10px}.line.sm i{background:#C9A24B}
.ticks{position:relative;height:20px;font-size:12px}.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.steps{padding-left:20px;display:grid;gap:8px;margin:0 0 28px}
.row.col{flex-direction:column;align-items:flex-start}.row.col>*{max-width:100%}.act{display:flex;flex-wrap:wrap;gap:8px}.act input{max-width:150px}
.row.col .line{width:100%}

.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--line)}
.chip.approved{background:#1f7a3d;color:#fff}.chip.rejected{background:#b3261e;color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:99px;font:inherit;font-weight:700;cursor:pointer}.tabs button.on{background:var(--ink);color:var(--bg)}
.auth{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin:24px 0}
.big{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,48px);letter-spacing:.04em}
.thumb{width:160px;max-width:100%;border-radius:10px;display:block}
.sm2{font-size:14px}.f.wide{max-width:none}
.credit{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}.credit img{width:130px;height:auto;border-radius:12px;display:block}.credit b{font-weight:700;color:var(--ink)}
</style>
</head>

function shrink(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('Could not process the image')),'image/jpeg',.8)};im.onerror=()=>rej(new Error('Could not read that image'));im.src=r.result};r.onerror=()=>rej(new Error('Could not read that file'));r.readAsDataURL(file)})}

function csvCell(x){let s=x==null?'':String(x);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
async function exportCsv(kind){
 const sp=EXP[kind];if(!sp)return;
 let rows=[],from=0;
 for(;;){const r=await sb.from(kind).select(sp.s).order('created_at').order('id').range(from,from+999);if(r.error)throw r.error;rows=rows.concat(r.data||[]);if(!r.data||r.data.length<1000)break;from+=1000}
 const csv=[sp.c.map(c=>csvCell(c[0])).join(',')].concat(rows.map(r=>sp.c.map(c=>csvCell(c[1](r))).join(','))).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
 a.download=kind+'-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

async function act(b){
 const [a,id]=b.dataset.a.split(':');b.disabled=true;
 try{
  if(a==='tab'){tab=id;await render();return}
  if(a==='exp'){await exportCsv(id);toast('Download started.');return}
  if(a==='logout'){await sb.auth.signOut();return}
  if(a==='forgot'){const e=v(id);if(!e){toast('Type your email first.');return}const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});if(r.error)throw r.error;toast('A password reset link was sent to your email.');return}
  if(a==='newpw'){const p=v('np');if(p.length<8){toast('Use at least 8 characters.');return}const r=await sb.auth.updateUser({password:p});if(r.error)throw r.error;RECOVERY=false;toast('Password updated.');await loadMe();await render();return}
  if(a==='login'){const r=await sb.auth.signInWithPassword({email:v('le'),password:$('lp').value});if(r.error)throw r.error;return}
  if(a==='reg'){
   const name=v('rn'),mobile=v('rm'),pw=$('rp').value;
   if(name.length<2||!/^\d{10}$/.test(mobile)||pw.length<6){toast('Enter your name, a 10-digit mobile number, and a password of 6 or more characters.');return}
   const r=await sb.auth.signUp({email:memail(mobile),password:pw,options:{data:{name,mobile}}});
   if(r.error)throw new Error(/already registered/i.test(r.error.message)?'This mobile number is already registered. Please log in.':r.error.message);
   if(!r.data.session)toast('Account created. Please log in with your mobile number and password.');return}
  if(a==='clogin'){
   const m=v('lm');if(!/^\d{10}$/.test(m)){toast('Enter your 10-digit mobile number.');return}
   const r=await sb.auth.signInWithPassword({email:memail(m),password:$('lpc').value});
   if(r.error)throw new Error(r.error.message==='Invalid login credentials'?'Wrong mobile number or password.':r.error.message);return}
  if(a==='bill'){
   const amt=Number(v('ba')),no=v('bn'),date=v('bd'),f=$('bf').files[0];
   if(!(amt>=ST.min_bill)||!no||!date||!f){toast('Fill every field and choose a photo. Minimum bill is '+inr(ST.min_bill)+'.');return}
   const path=U.id+'/'+Date.now()+'.jpg';await upload('bills',path,f,1600);
   const r=await sb.rpc('submit_bill',{p_amount:amt,p_bill_no:no,p_bill_date:date,p_photo_path:path});if(r.error)throw r.error;
   toast('Bill sent. You will see it here once the owner approves it.');await render();return}
  if(a==='ok'||a==='no'){
   const amt=Number(v('am'+id)),note=v('rj'+id);
   if(a==='no'&&note.length<3){toast('Type a reason to reject.');return}
   const r=await sb.rpc('review_bill',{p_bill_id:Number(id),p_approve:a==='ok',p_note:note||null,p_amount:a==='ok'?amt:null});if(r.error)throw r.error;
   toast(a==='ok'?'Approved. Card updated.':'Rejected.');await render();return}
  if(a==='adj'){const amt=Number(v('aja'));const r=await sb.rpc('adjust_progress',{p_loyalty_id:v('ajc'),p_amount:amt,p_reason:v('ajr')});if(r.error)throw r.error;toast('Card adjusted.');await render();return}
  if(a==='delcust'){
   const lid=v('dc').toUpperCase(),mob=v('dm');
   const c=await sb.from('customers').select('*').eq('loyalty_id',lid).maybeSingle();
   if(!c.data){toast('Customer not found.');return}
   if(mob!==c.data.mobile){toast('Type the customer’s mobile number exactly to confirm.');return}
   const bl=await sb.from('bills').select('photo_path').eq('customer_id',c.data.id);
   const paths=(bl.data||[]).map(x=>x.photo_path);
   if(paths.length){const rm=await sb.storage.from('bills').remove(paths);if(rm.error)throw rm.error;if((rm.data||[]).length<paths.length)throw new Error('Could not delete all bill photos. Run 03_delete_customer.sql in Supabase first.')}
   const r=await sb.rpc('delete_customer',{p_loyalty_id:lid});if(r.error)throw r.error;
   toast('Deleted '+r.data+' and their bill photos.');await render();return}
  if(a==='usec'){const r=await sb.rpc('use_coupon',{p_code:v('cc')});if(r.error)throw r.error;toast('Coupon marked used: '+r.data);await render();return}
  if(a==='rules'){const r=await sb.from('settings').update({goal_amount:Number(v('sg')),reward_value:Number(v('sr')),reward_title:v('st'),min_bill:Number(v('sm')),coupon_valid_days:Number(v('sd')),max_pending_bills:Number(v('sp'))}).eq('id',1);if(r.error)throw r.error;await loadMe();toast('Rules saved.');await render();return}
  if(a==='osave'){
   const f=$('op'+id).files[0],row={title:v('ot'+id),details:v('od'+id),active:$('oa'+id).checked};
   if(row.title.length<2){toast('Add a title.');return}
   if(f)row.poster_path=await upload('posters',adminShop+'/'+Date.now()+'.jpg',f,1200);
   const r=await sb.from('offers').update(row).eq('id',Number(id));if(r.error)throw r.error;await loadOffers();toast('Offer saved.');await render();return}
  if(a==='odel'){if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Tap again to delete';b.disabled=false;return}
   const r=await sb.from('offers').delete().eq('id',Number(id));if(r.error)throw r.error;await loadOffers();toast('Offer deleted.');await render();return}
  if(a==='oadd'){
   const title=v('nt');if(title.length<2){toast('Add a title.');return}
   const f=$('np2').files[0],row={shop:adminShop,title,details:v('nd'),sort:OFF.length+10};
   if(f)row.poster_path=await upload('posters',adminShop+'/'+Date.now()+'.jpg',f,1200);
   const r=await sb.from('offers').insert(row);if(r.error)throw r.error;await loadOffers();toast('Offer added.');await render();return}
 }catch(e){toast((e&&e.message)||'Something went wrong. Please try again.')}
 finally{b.disabled=false}
}
async function render(){
 const r=location.hash.slice(1)||'home';
 const cur=(B[r]||r==='about'||r==='rewards'||r==='admin')?r:'home';
 const nav=[['home','Home'],['modern-man','Modern Man'],['fashion-fuel','Fashion Fuel'],['mina-rice','Mina Rice'],['rewards','Rewards'],['about','About']];
 let body;
 try{body=B[r]?biz(r):r==='rewards'?await rewardsView():r==='about'?about():r==='admin'?await adminView():home()}
 catch(e){body='<section class="pg wrap"><p class="mut">Something went wrong. Please refresh the page.</p></section>'}
 app.innerHTML=`<div class="wrap"><header><a class="brand" href="#home" aria-label="Modern Groups home"><img class="mark" src="${L.m}" alt="">Modern Groups</a><nav aria-label="Main">${nav.map(n=>`<a href="#${n[0]}"${n[0]===cur?' class="on"':''}>${n[1]}</a>`).join('')}</nav></header></div>${body}<div class="wrap"><footer class="credit"><img src="${LT}" alt="M Technology logo"><span>Created by <b>FatahX</b></span><span>© 2026 Modern Groups · <a href="#admin">Owner login</a></span></footer></div>`;
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b)});
app.addEventListener('change',e=>{if(e.target.id==='shopsel'){adminShop=e.target.value;render()}});
app.addEventListener('input',e=>{if(e.target.id==='ls')$('cl').innerHTML=custList()});
window.addEventListener('hashchange',()=>{render().then(()=>window.scrollTo(0,0))});
sb.auth.onAuthStateChange((ev)=>{if(ev==='INITIAL_SESSION')return;if(ev==='PASSWORD_RECOVERY')RECOVERY=true;setTimeout(async()=>{await loadMe();await render()},0)});
(async()=>{await loadOffers();await loadMe();await render()})();
</script>
